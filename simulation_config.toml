# ToyChain Simulation Configuration

[network]
nodes = 5
max_peers = 3
seed_nodes = ["127.0.0.1:8000"]

[blockchain]
difficulty = 12
block_reward = 50
max_block_size = 1000000  # bytes
max_txs_per_block = 10

[simulation]
duration_rounds = 30
tx_creation_probability = 0.7
mining_rounds_per_node = [1, 2, 1, 1, 3]  # Разная мощность майнеров
invalid_tx_probability = 0.1

[wallets]
initial_count = 5
names = ["Alice", "Bob", "Carol", "Dave", "Eve"]

[scenarios]
# Можно выбрать сценарий
active = "normal"  # Options: "normal", "51_attack", "network_partition", "spam_attack"

[scenarios.normal]
description = "Normal blockchain operation"

[scenarios.attack_51]
description = "51% attack simulation"
attacker_hash_power = 0.6
target_transaction = { from = "Alice", to = "Bob", amount = 100 }
fork_at_block = 10

[scenarios.network_partition]
description = "Network split and rejoin"
split_at_round = 10
rejoin_at_round = 20
group_a = [0, 1]
group_b = [2, 3, 4]

[scenarios.spam_attack]
description = "Spam attack with many transactions"
spam_rate = 10  # transactions per round
attacker_wallet = "Eve"

[visualization]
show_mempool = true
show_balances = true
show_network_topology = true
show_block_details = true
log_level = "info"  # "debug", "info", "warn"

